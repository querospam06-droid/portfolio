+<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <title>Contato — Portfolio gFalasco</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<body class="contact-view">
  <header class="topbar" id="top">
    <a class="brand" href="index.html" aria-label="Voltar ao início"><img class="brand-mark brand-logo" src="logo-f-icon.png" alt="" /><span>gFalasco</span></a>
    <nav class="main-nav" aria-label="Navegação principal">
      <a href="index.html">Início</a><a class="nav-project-button" href="projetos.html">Projetos</a><a href="contato.html" aria-current="page">Contato</a>
    </nav>
    <span class="topbar-end-space" aria-hidden="true"></span>
    <button class="menu-toggle" aria-label="Abrir menu" aria-expanded="false"><span></span><span></span></button>
  </header>
  <main class="contact-page">
    <section class="contact-section contact-page-section">
      <div class="contact-floating-copy">
        <h1>Tem uma ideia?<br><span class="gradient-text">Fale comigo.</span></h1>
      </div>
      <div class="contact-inner">
        <div class="contact-details">
          <div class="contact-email-area">
            <span class="contact-email-tab">Email</span>
            <a class="contact-email-address contact-address-link" href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=gabriel.fpagano@gmail.com" target="_blank" rel="noreferrer" aria-label="Abrir uma nova mensagem no Gmail para Gabriel Falasco Pagano"><svg class="contact-social-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M3 6.7v10.8c0 .8.7 1.5 1.5 1.5H7V10L3 6.7z"/><path fill="#34A853" d="M17 10v9h2.5c.8 0 1.5-.7 1.5-1.5V6.7L17 10z"/><path fill="#FBBC04" d="M3 6.7 5 5l7 5.3L19 5l2 1.7-9 6.8-9-6.8z"/><path fill="#EA4335" d="M3 6.7 5 5l7 5.3V14L3 7.3z"/><path fill="#C5221F" d="m21 6.7-2-1.7-7 5.3V14l9-6.7z"/></svg><span>gabriel.fpagano@gmail.com</span></a>
          </div>
          <div class="contact-email-area">
            <span class="contact-email-tab">Instagram</span>
            <a class="contact-email-address contact-address-link" href="https://www.instagram.com/falasc0/" target="_blank" rel="noreferrer"><svg class="contact-social-icon instagram-icon" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="instagram-gradient" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#f9ce34"/><stop offset=".48" stop-color="#ee2a7b"/><stop offset="1" stop-color="#6228d7"/></linearGradient></defs><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="url(#instagram-gradient)" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="url(#instagram-gradient)" stroke-width="2"/><circle cx="17.5" cy="6.8" r="1.2" fill="#ee2a7b"/></svg><span>@falasc0</span></a>
          </div>
          <div class="contact-email-area">
            <span class="contact-email-tab">WhatsApp</span>
            <span class="contact-email-address contact-address-link"><svg class="contact-social-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#25D366" d="M12 2a9.8 9.8 0 0 0-8.4 14.8L2.3 22l5.3-1.4A10 10 0 1 0 12 2Z"/><path fill="#fff" d="M16.9 14.6c-.3-.2-1.7-.9-2-.9s-.5-.2-.7.2-.8.9-.9 1.1-.3.2-.6.1a7.8 7.8 0 0 1-2.3-1.4 8.6 8.6 0 0 1-1.6-2c-.2-.3 0-.5.1-.6l.4-.5.3-.5c.1-.2 0-.4 0-.5l-.9-2.1c-.2-.5-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4s-1 1-1 2.4 1 2.8 1.1 3 2 3.1 4.9 4.3c.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.7-.7 1.9-1.4.2-.7.2-1.2.1-1.4s-.3-.2-.6-.4Z"/></svg><span>+55 (11) 00000-0000</span></span>
          </div>
        </div>
        <form class="contact-form" id="contact-form">
          <input type="hidden" name="_subject" value="Nova mensagem pelo portfólio gFalasco" />
          <label class="sr-only" for="contact-name">Seu nome</label>
          <input id="contact-name" name="name" type="text" placeholder="Seu nome" autocomplete="name" required />
          <label class="sr-only" for="contact-email">Seu e-mail</label>
          <input id="contact-email" name="email" type="email" placeholder="Seu e-mail (para resposta)" autocomplete="email" required />
          <label class="sr-only" for="contact-message">Sua mensagem</label>
          <textarea id="contact-message" name="message" placeholder="Escreva sua mensagem..." rows="3" required></textarea>
          <button class="contact-submit" type="submit">Enviar mensagem <span aria-hidden="true">↗</span></button>
          <p class="contact-form-status" id="contact-form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>
  <footer class="footer"><a class="brand" href="index.html"><img class="brand-mark brand-logo" src="logo-f-icon.png" alt="" /><span>gFalasco</span></a><span>Feito com intenção e café. © <span id="year"></span></span><a href="#top">Voltar ao topo ↑</a></footer>
</body>
</html>
